<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<title>STEP Face Color Editor</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #000; color: #f5f5f7; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif; font-size: 13px; display: flex; height: 100vh; overflow: hidden; -webkit-font-smoothing: antialiased; }
#sidebar { width: 272px; min-width: 272px; background: rgba(28,28,30,0.96); border-right: 1px solid rgba(255,255,255,0.08); display: flex; flex-direction: column; overflow: hidden; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
#sidebar-header { padding: 16px 16px 12px; border-bottom: 1px solid rgba(255,255,255,0.07); }
#sidebar-header h1 { font-size: 15px; font-weight: 600; color: #f5f5f7; letter-spacing: -0.01em; }
#sidebar-header span { color: rgba(235,235,245,0.4); font-size: 11px; display: block; font-weight: 400; margin-top: 2px; letter-spacing: 0; }
.section { padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.06); }
.section label { display: block; font-size: 10px; font-weight: 500; color: rgba(235,235,245,0.4); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.06em; }
#drop-zone { border: 1.5px dashed rgba(255,255,255,0.18); border-radius: 10px; padding: 14px 10px; text-align: center; cursor: pointer; color: rgba(235,235,245,0.4); font-size: 12px; transition: all 0.15s; }
#drop-zone:hover, #drop-zone.drag-over { border-color: #0a84ff; color: #0a84ff; background: rgba(10,132,255,0.06); }
#drop-zone input { display: none; }

#active-color-wrap { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
#active-swatch { width: 32px; height: 26px; border-radius: 6px; border: 1.5px solid rgba(255,255,255,0.15); flex-shrink: 0; }
#active-swatch-hex { width: 80px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 7px; color: #f5f5f7; padding: 5px 8px; font-family: 'SF Mono', 'Menlo', monospace; font-size: 12px; outline: none; flex-shrink: 0; }
#active-swatch-hex:focus { border-color: #0a84ff; background: rgba(10,132,255,0.08); }
#cpick-wrap { margin-bottom: 10px; user-select: none; }
#cpick-sv { width: 100%; height: 150px; border-radius: 8px; cursor: crosshair; display: block; }
#cpick-hue { width: 100%; height: 14px; border-radius: 7px; cursor: crosshair; display: block; margin-top: 6px; }
.presets { display: flex; gap: 5px; flex-wrap: wrap; }
.preset { width: 22px; height: 22px; border-radius: 5px; border: 1.5px solid rgba(255,255,255,0.1); cursor: pointer; transition: transform 0.1s; }
.preset:hover { transform: scale(1.2); border-color: rgba(255,255,255,0.3); }
.preset.active-preset { border: 2px solid #0a84ff; box-shadow: 0 0 0 1px rgba(10,132,255,0.4); }
#color-palette { display: flex; flex-direction: column; gap: 3px; max-height: 200px; overflow-y: auto; }
#color-palette::-webkit-scrollbar { width: 3px; }
#color-palette::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 2px; }
.pal-item { display: flex; align-items: center; gap: 8px; padding: 5px 7px; border-radius: 7px; cursor: pointer; border: 1px solid transparent; transition: background 0.1s; }
.pal-item:hover { background: rgba(255,255,255,0.05); }
.pal-item.pal-active { background: rgba(10,132,255,0.12); border-color: rgba(10,132,255,0.3); }
.pal-swatch { width: 20px; height: 20px; border-radius: 5px; flex-shrink: 0; border: 1px solid rgba(255,255,255,0.12); }
.pal-hex { font-size: 11px; color: rgba(235,235,245,0.55); flex: 1; font-family: 'SF Mono', 'Menlo', monospace; }
.pal-count { font-size: 10px; color: rgba(235,235,245,0.25); }
.pal-recolor { background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.1); color: rgba(235,235,245,0.5); border-radius: 5px; padding: 2px 7px; font-size: 10px; cursor: pointer; font-family: inherit; transition: all 0.12s; }
.pal-recolor:hover { background: rgba(10,132,255,0.15); border-color: rgba(10,132,255,0.4); color: #0a84ff; }
#paint-hint { font-size: 10px; color: rgba(235,235,245,0.25); margin-top: 7px; line-height: 1.5; }

#face-list { flex: 1; overflow-y: auto; }
#face-list::-webkit-scrollbar { width: 4px; }
#face-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); }
.face-item { display: flex; align-items: center; gap: 8px; padding: 6px 16px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 12px; }
.face-item:hover { background: rgba(255,255,255,0.04); }
.face-item.selected { background: rgba(10,132,255,0.12); color: #0a84ff; }
.face-swatch { width: 12px; height: 12px; border-radius: 3px; border: 1px solid rgba(255,255,255,0.15); flex-shrink: 0; }
.log-ok { color: #30d158; } .log-warn { color: #ff9f0a; } .log-err { color: #ff453a; }

#canvas-wrap { flex: 1; position: relative; cursor: default; }
canvas { display: block; width: 100%; height: 100%; }
#toolbar { position: absolute; top: 12px; right: 12px; display: flex; flex-direction: column; gap: 4px; }
.tbtn { background: rgba(44,44,46,0.85); border: 1px solid rgba(255,255,255,0.1); color: rgba(235,235,245,0.75); border-radius: 9px; padding: 6px 12px; cursor: pointer; font-family: inherit; font-size: 12px; font-weight: 500; white-space: nowrap; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); transition: all 0.12s; letter-spacing: -0.01em; }
.tbtn:hover:not(:disabled) { background: rgba(58,58,60,0.9); border-color: rgba(255,255,255,0.18); color: #f5f5f7; }
.tbtn.on { background: rgba(10,132,255,0.2); border-color: rgba(10,132,255,0.5); color: #0a84ff; }
.tbtn:disabled { opacity: 0.3; cursor: default; }
#hint { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); background: rgba(28,28,30,0.8); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 6px 18px; font-size: 11px; color: rgba(235,235,245,0.35); pointer-events: none; white-space: nowrap; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
#overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
.spinner { width: 32px; height: 32px; border: 2.5px solid rgba(255,255,255,0.1); border-top-color: #0a84ff; border-radius: 50%; animation: spin 0.75s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
#overlay-text { color: #f5f5f7; font-size: 14px; font-weight: 500; }
#overlay-sub { color: rgba(235,235,245,0.4); font-size: 12px; }
#fav-colors { display: flex; gap: 5px; flex-wrap: wrap; min-height: 22px; }
.fav-swatch { width: 22px; height: 22px; border-radius: 5px; border: 1.5px solid rgba(255,255,255,0.1); cursor: pointer; transition: transform 0.1s; }
.fav-swatch:hover { transform: scale(1.15); border-color: rgba(255,255,255,0.3); }
#btn-fav-add { background: rgba(255,255,255,0.06); border: 1.5px dashed rgba(255,255,255,0.18); border-radius: 5px; width: 22px; height: 22px; cursor: pointer; color: rgba(235,235,245,0.4); font-size: 14px; display: flex; align-items: center; justify-content: center; transition: all 0.12s; flex-shrink: 0; padding: 0; }
#btn-fav-add:hover { border-color: #0a84ff; color: #0a84ff; background: rgba(10,132,255,0.08); }
#btn-fav-save { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: 5px; color: rgba(235,235,245,0.45); padding: 2px 7px; font-family: inherit; font-size: 10px; font-weight: 500; cursor: pointer; transition: all 0.12s; }
#btn-fav-save:hover { background: rgba(10,132,255,0.15); border-color: rgba(10,132,255,0.4); color: #0a84ff; }
#palette-count { color: #0a84ff !important; }
</style>
<script id="favorites-data" type="application/json">["#c7c7c7","#4d4d4d"]</script>
</head>
<body>
<div id="sidebar">
  <div id="sidebar-header"><h1>STEP Color Editor</h1><span>OpenCascade · Face Painter</span></div>
  <div class="section">
    <label>File</label>
    <div id="drop-zone">Drop .stp / .step here<br>or click to browse<input type="file" id="file-input" accept=".stp,.step,.p21"></div>
  </div>
  <div class="section">
    <label>Active Color — right-click face to paint</label>
    <div id="active-color-wrap">
      <div id="active-swatch"></div>
      <input type="text" id="active-swatch-hex" value="#4488ff" maxlength="7" spellcheck="false">

    <div class="presets" id="presets"></div>
    <div id="fav-row" style="display:flex;align-items:center;gap:5px;margin-top:8px;flex-wrap:wrap;">
      <span style="font-size:10px;font-weight:500;color:rgba(235,235,245,0.35);text-transform:uppercase;letter-spacing:0.06em;flex-shrink:0;">Favorites</span>
      <div id="fav-colors" style="display:flex;gap:4px;flex-wrap:wrap;"></div>

      <button id="btn-fav-save" title="Save favorites to this file" style="margin-left:auto;">Save</button>

<div id="canvas-wrap">

  <div id="overlay">
    <div class="spinner"></div>
    <div id="overlay-text">Loading OpenCascade...</div>

  </div>

    <button class="tbtn on" id="btn-ortho">Perspective</button>
    <button class="tbtn" id="btn-wire">Wireframe</button>

    <button class="tbtn" id="btn-hide" disabled="">Hide face</button>
    <button class="tbtn" id="btn-showall">Show all</button>
    <button class="tbtn" id="btn-home">Reset view</button>
    <button class="tbtn" id="btn-export" disabled="">Export STEP</button>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ── Log (silent) ─────────────────────────────────────────────
function log(){}

// ── Undo / redo ───────────────────────────────────────────────
const undoStack=[], redoStack=[];
function pushUndo(faceIdx, prevColor, nextColor){
  undoStack.push({faceIdx, prevColor, nextColor});
  redoStack.length=0; // clear redo on new action
}
function undo(){
  if(!undoStack.length) return;
  const entry=undoStack.pop();
  if(entry.bulk){
    // Bulk: array of {faceIdx,prevColor,nextColor}
    entry.changes.forEach(({faceIdx,prevColor})=>applyColor(faceIdx,prevColor,false));
    redoStack.push(entry);
  } else {
    redoStack.push({faceIdx:entry.faceIdx,prevColor:entry.prevColor,nextColor:entry.nextColor});
    applyColor(entry.faceIdx,entry.prevColor,false);
  }
}
function redo(){
  if(!redoStack.length) return;
  const entry=redoStack.pop();
  if(entry.bulk){
    entry.changes.forEach(({faceIdx,nextColor})=>applyColor(faceIdx,nextColor,false));
    undoStack.push(entry);
  } else {
    undoStack.push({faceIdx:entry.faceIdx,prevColor:entry.prevColor,nextColor:entry.nextColor});
    applyColor(entry.faceIdx,entry.nextColor,false);
  }
}
function applyColor(idx, hex, pushHistory=true){
  const prev=faces[idx].color;
  if(pushHistory) pushUndo(idx, prev, hex);
  faces[idx].color=hex;
  faces[idx].userColored=(hex!==faces[idx].defaultColor);
  faces[idx].mesh.material.color.set(hex);
  updatePalette(prev, hex, idx);
}

// ── Color palette ─────────────────────────────────────────────
// Map: hex → Set of face indices using that color
const colorMap=new Map();

function initPalette(){
  colorMap.clear();
  for(let i=0;i<faces.length;i++){
    const hex=faces[i].defaultColor||faces[i].color;
    if(!colorMap.has(hex)) colorMap.set(hex,new Set());
    colorMap.get(hex).add(i);
    faces[i].color=hex; // reset to default on reload
  }
  renderPalette();
}

function updatePalette(prevHex, newHex, faceIdx){
  // Remove from old color
  if(colorMap.has(prevHex)){
    colorMap.get(prevHex).delete(faceIdx);
    if(colorMap.get(prevHex).size===0) colorMap.delete(prevHex);
  }
  // Add to new color
  if(!colorMap.has(newHex)) colorMap.set(newHex,new Set());
  colorMap.get(newHex).add(faceIdx);
  renderPalette();
}

function renderPalette(){
  const section=document.getElementById('color-palette-section');
  const el=document.getElementById('color-palette');
  const count=document.getElementById('palette-count');
  if(!colorMap.size){section.style.display='none';return;}
  section.style.display='';
  count.textContent=colorMap.size;
  el.innerHTML='';
  // Sort by face count descending
  const sorted=[...colorMap.entries()].sort((a,b)=>b[1].size-a[1].size);
  for(const [hex,faceSet] of sorted){
    const item=document.createElement('div');
    item.className='pal-item';
    item.innerHTML=`
      <div class="pal-swatch" style="background:${hex}"></div>
      <span class="pal-hex">${hex}</span>
      <span class="pal-count">${faceSet.size}f</span>
      <button class="pal-recolor">Set active</button>`;
    // Click row = select active color
    item.querySelector('.pal-recolor').onclick=e=>{
      e.stopPropagation();
      setActiveColor(hex);
    };
    // Click swatch = recolor all faces with this color to active color
    item.querySelector('.pal-swatch').onclick=e=>{
      e.stopPropagation();
      const targets=[...faceSet];
      const cur=activeColor;
      const changes=targets
        .map(i=>({faceIdx:i,prevColor:faces[i].color,nextColor:cur}))
        .filter(c=>c.prevColor!==c.nextColor);
      if(!changes.length) return;
      changes.forEach(({faceIdx,nextColor})=>applyColor(faceIdx,nextColor,false));
      undoStack.push({bulk:true,changes});
      redoStack.length=0;
    };
    el.appendChild(item);
  }
}

document.addEventListener('keydown',e=>{
  if(e.ctrlKey&&e.key==='z'){e.preventDefault();undo();}
  if(e.ctrlKey&&(e.key==='y'||e.key==='Z')){e.preventDefault();redo();}
});

// ── Custom HSV color picker ───────────────────────────────────
let activeColor='#4488ff';
const activeSwatch=document.getElementById('active-swatch');
const activeHexEl=document.getElementById('active-swatch-hex');
const presetsEl=document.getElementById('presets');
const svCanvas=document.getElementById('cpick-sv');
const hueCanvas=document.getElementById('cpick-hue');
const svCtx=svCanvas.getContext('2d');
const hueCtx=hueCanvas.getContext('2d');

let cpH=220,cpS=0.73,cpV=1.0;
const usedColors=new Map();
let activePresetEl=null;

function hexToHsv(hex){
  const r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;
  const max=Math.max(r,g,b),min=Math.min(r,g,b),d=max-min;
  let h=0,s=max?d/max:0,v=max;
  if(d){if(max===r)h=((g-b)/d+6)%6;else if(max===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;}
  return{h,s,v};
}
function hsvToHex(h,s,v){
  const f=n=>{const k=(n+h/60)%6;return v-v*s*Math.max(0,Math.min(k,4-k,1));};
  return'#'+[f(5),f(3),f(1)].map(x=>Math.round(x*255).toString(16).padStart(2,'0')).join('');
}

function drawSV(){
  const w=svCanvas.width,h=svCanvas.height;
  const gS=svCtx.createLinearGradient(0,0,w,0);
  gS.addColorStop(0,'#fff');gS.addColorStop(1,`hsl(${cpH},100%,50%)`);
  svCtx.fillStyle=gS;svCtx.fillRect(0,0,w,h);
  const gV=svCtx.createLinearGradient(0,0,0,h);
  gV.addColorStop(0,'transparent');gV.addColorStop(1,'#000');
  svCtx.fillStyle=gV;svCtx.fillRect(0,0,w,h);
  const cx=cpS*w,cy=(1-cpV)*h;
  svCtx.beginPath();svCtx.arc(cx,cy,6,0,Math.PI*2);
  svCtx.strokeStyle='#fff';svCtx.lineWidth=2;svCtx.stroke();
  svCtx.beginPath();svCtx.arc(cx,cy,7,0,Math.PI*2);
  svCtx.strokeStyle='rgba(0,0,0,0.5)';svCtx.lineWidth=1;svCtx.stroke();
}
function drawHue(){
  const w=hueCanvas.width,h=hueCanvas.height;
  const g=hueCtx.createLinearGradient(0,0,w,0);
  for(let i=0;i<=6;i++)g.addColorStop(i/6,`hsl(${i*60},100%,50%)`);
  hueCtx.fillStyle=g;hueCtx.fillRect(0,0,w,h);
  const cx=(cpH/360)*w;
  hueCtx.fillStyle='#fff';hueCtx.strokeStyle='rgba(0,0,0,0.5)';hueCtx.lineWidth=1;
  hueCtx.beginPath();hueCtx.roundRect(cx-4,1,8,h-2,2);hueCtx.fill();hueCtx.stroke();
}

function resizePicker(){
  const w=svCanvas.parentElement.parentElement.clientWidth-32;
  if(w<10)return;
  svCanvas.width=w;svCanvas.height=150;
  hueCanvas.width=w;hueCanvas.height=14;
  drawSV();drawHue();
}

function pickerChanged(){
  const hex=hsvToHex(cpH,cpS,cpV);
  activeColor=hex;
  activeSwatch.style.background=hex;
  activeHexEl.value=hex;
  if(activePresetEl)activePresetEl.classList.remove('active-preset');
  activePresetEl=usedColors.get(hex)||null;
  if(activePresetEl)activePresetEl.classList.add('active-preset');
}

let draggingSV=false,draggingHue=false;
svCanvas.addEventListener('mousedown',e=>{draggingSV=true;updateSV(e);e.preventDefault();e.stopPropagation();});
hueCanvas.addEventListener('mousedown',e=>{draggingHue=true;updateHue(e);e.preventDefault();e.stopPropagation();});
window.addEventListener('mousemove',e=>{if(draggingSV)updateSV(e);if(draggingHue)updateHue(e);});
window.addEventListener('mouseup',()=>{draggingSV=false;draggingHue=false;});

function updateSV(e){
  const r=svCanvas.getBoundingClientRect();
  cpS=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));
  cpV=1-Math.max(0,Math.min(1,(e.clientY-r.top)/r.height));
  drawSV();pickerChanged();
}
function updateHue(e){
  const r=hueCanvas.getBoundingClientRect();
  cpH=Math.max(0,Math.min(359,((e.clientX-r.left)/r.width)*360));
  drawSV();drawHue();pickerChanged();
}

function setActiveColor(hex,presetEl){
  hex=hex.toLowerCase();
  if(!/^#[0-9a-f]{6}$/.test(hex))return;
  const hsv=hexToHsv(hex);cpH=hsv.h;cpS=hsv.s;cpV=hsv.v;
  activeColor=hex;activeSwatch.style.background=hex;activeHexEl.value=hex;
  drawSV();drawHue();
  if(activePresetEl)activePresetEl.classList.remove('active-preset');
  activePresetEl=presetEl||usedColors.get(hex)||null;
  if(activePresetEl)activePresetEl.classList.add('active-preset');
}

function recordColor(hex){
  hex=hex.toLowerCase();
  if(usedColors.has(hex)){setActiveColor(hex,usedColors.get(hex));return;}
  const d=document.createElement('div');
  d.className='preset';d.style.background=hex;d.title=hex;
  d.onclick=()=>setActiveColor(hex,d);
  presetsEl.appendChild(d);
  usedColors.set(hex,d);
  setActiveColor(hex,d);
}

activeHexEl.addEventListener('input',()=>{
  let v=activeHexEl.value.trim();
  if(!v.startsWith('#'))v='#'+v;
  if(/^#[0-9a-f]{6}$/i.test(v))setActiveColor(v.toLowerCase());
});
activeHexEl.addEventListener('blur',()=>{
  if(!/^#[0-9a-f]{6}$/i.test(activeHexEl.value))activeHexEl.value=activeColor;
});

setTimeout(resizePicker,50);
window.addEventListener('resize',resizePicker);

// ── Three.js ─────────────────────────────────────────────────
const canvas=document.getElementById('viewport');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setClearColor(0x1c1c1e);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(50,1,0.01,100000);
scene.add(new THREE.AmbientLight(0xffffff,0.92));
const dl=new THREE.DirectionalLight(0xffffff,0.08);dl.position.set(1,2,3);scene.add(dl);

let faces=[],selectedIdx=-1,modelGroup=null,wireOn=false,orthoOn=true;
// Ortho camera sits at a fixed large distance so near plane never clips
const ORTHO_CAM_DIST=1000;
const orthoCamera=new THREE.OrthographicCamera(-5,5,5,-5,0.1,10000);
let activeCamera=orthoCamera;

// ── Camera ────────────────────────────────────────────────────
// Keep a rotation matrix. Horizontal drag = rotate around world Y.
// Vertical drag = rotate around camera's current X axis.
// This is exactly how Maya/Blender tumble works — no poles, no flip.
let camDist=10;
let camTarget=new THREE.Vector3();
let camRotM=new THREE.Matrix4().makeRotationX(0.5).premultiply(new THREE.Matrix4().makeRotationY(0.6));

function tbUpdate(){
  // Perspective camera: position at camDist from target
  const pos=new THREE.Vector3(0,0,camDist).applyMatrix4(camRotM);
  camera.position.copy(camTarget).add(pos);
  camera.lookAt(camTarget);
  camera.up.set(camRotM.elements[4],camRotM.elements[5],camRotM.elements[6]);
  // Scale near plane with distance so it never clips when zoomed in
  camera.near=camDist*0.001;
  camera.far=camDist*100+1000;
  camera.updateProjectionMatrix();

  // Ortho camera: always sits at ORTHO_CAM_DIST so near plane never clips
  // Only the frustum size changes to simulate zoom (camDist drives apparent size)
  const orthoPos=new THREE.Vector3(0,0,ORTHO_CAM_DIST).applyMatrix4(camRotM);
  orthoCamera.position.copy(camTarget).add(orthoPos);
  orthoCamera.quaternion.copy(camera.quaternion);
  orthoCamera.up.copy(camera.up);
  const aspect=camera.aspect||1;
  const orthoH=camDist*Math.tan(THREE.MathUtils.degToRad(camera.fov/2))*2;
  const orthoW=orthoH*aspect;
  orthoCamera.left=-orthoW/2; orthoCamera.right=orthoW/2;
  orthoCamera.top=orthoH/2; orthoCamera.bottom=-orthoH/2;
  orthoCamera.near=1; orthoCamera.far=ORTHO_CAM_DIST*2+1000;
  orthoCamera.updateProjectionMatrix();
}
tbUpdate();

function resetCamera(){
  camDist=10; camTarget.set(0,0,0);
  camRotM.makeRotationX(0.5).premultiply(new THREE.Matrix4().makeRotationY(0.6));
  tbUpdate();
}

// ── Input handling ────────────────────────────────────────────
let mouseState={down:false,button:-1,startX:0,startY:0,lastX:0,lastY:0,moved:false};

canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('mousedown',e=>{
  mouseState={down:true,button:e.button,startX:e.clientX,startY:e.clientY,lastX:e.clientX,lastY:e.clientY,moved:false};
  if(e.button===2){e.preventDefault();doPaint(e);}
});
window.addEventListener('mousemove',e=>{
  const totalDx=e.clientX-mouseState.startX, totalDy=e.clientY-mouseState.startY;
  if(Math.abs(totalDx)>3||Math.abs(totalDy)>3) mouseState.moved=true;
  const dx=e.clientX-mouseState.lastX, dy=e.clientY-mouseState.lastY;
  mouseState.lastX=e.clientX; mouseState.lastY=e.clientY;
  if(!mouseState.down) return;

  if(mouseState.button===1){
    // Always rotate around camera's OWN axes so drag matches screen at any orientation
    // Horizontal dx → rotate around camera's current Y axis (column 1)
    // Vertical dy → rotate around camera's current X axis (column 0)
    const cx=new THREE.Vector3(camRotM.elements[0],camRotM.elements[1],camRotM.elements[2]);
    const cy=new THREE.Vector3(camRotM.elements[4],camRotM.elements[5],camRotM.elements[6]);
    const rx=new THREE.Matrix4().makeRotationAxis(cx,-dy*0.007);
    const ry=new THREE.Matrix4().makeRotationAxis(cy,-dx*0.007);
    camRotM.premultiply(rx).premultiply(ry);
    tbUpdate();
  } else if(mouseState.button===0){
    const panSpeed=camDist*0.001;
    // Pan along camera X and Y axes
    const cx=new THREE.Vector3(camRotM.elements[0],camRotM.elements[1],camRotM.elements[2]);
    const cy=new THREE.Vector3(camRotM.elements[4],camRotM.elements[5],camRotM.elements[6]);
    camTarget.addScaledVector(cx,-dx*panSpeed).addScaledVector(cy,dy*panSpeed);
    tbUpdate();
  } else if(mouseState.button===2){
    doPaint(e);
  }
});
window.addEventListener('mouseup',e=>{
  if(!mouseState.moved){
    if(mouseState.button===0) doSelect(e);
  }
  mouseState.down=false;
});
canvas.addEventListener('wheel',e=>{
  const zoomFactor=1+e.deltaY*0.001;
  const rect=canvas.getBoundingClientRect();
  const ndcX=((e.clientX-rect.left)/rect.width)*2-1;
  const ndcY=-((e.clientY-rect.top)/rect.height)*2+1;
  if(orthoOn){
    // In ortho mode zoom by scaling camDist (which drives frustum size)
    camDist=Math.max(0.01,camDist*zoomFactor);
  } else {
    // Find the 3D point under the cursor, then zoom toward it
    const ray=new THREE.Ray();
    ray.origin.copy(camera.position);
    ray.direction.set(ndcX,ndcY,-1).applyMatrix4(camera.projectionMatrixInverse).applyMatrix4(camera.matrixWorld).sub(camera.position).normalize();
    // Point on ray at current camDist
    const mouseWorld=ray.origin.clone().addScaledVector(ray.direction,camDist);
    // Shift target toward mouseWorld so zoom feels centered on cursor
    const newDist=Math.max(0.01,camDist*zoomFactor);
    const shift=1-newDist/camDist;
    camTarget.addScaledVector(mouseWorld.sub(camTarget),shift);
    camDist=newDist;
  }
  tbUpdate();
  e.preventDefault();
},{passive:false});

function getHitFromXY(cx,cy){
  if(!faces.length) return null;
  const rect=canvas.getBoundingClientRect();
  const mouse=new THREE.Vector2(((cx-rect.left)/rect.width)*2-1,-((cy-rect.top)/rect.height)*2+1);
  const rc=new THREE.Raycaster();
  rc.setFromCamera(mouse,activeCamera);
  const hits=rc.intersectObjects(faces.map(f=>f.mesh).filter(m=>m.visible),false);
  if(!hits.length) return null;
  return faces.findIndex(f=>f.mesh===hits[0].object);
}

function getHit(e){return getHitFromXY(e.clientX,e.clientY);}

function doSelect(e){
  const idx=getHit(e);
  if(idx===null||idx<0) return;
  selectFace(idx);
}

function doPaint(e){
  const idx=getHit(e);
  if(idx===null||idx<0) return;
  paintFace(idx,activeColor);
}

function selectFace(idx){
  // Selection is just for hide/show — no visual highlight
  selectedIdx=idx;
  document.getElementById('btn-hide').disabled=false;
}

let hoveredIdx=-1;
function setHover(idx){
  if(hoveredIdx===idx) return;
  if(hoveredIdx>=0){
    faces[hoveredIdx].mesh.material.emissive.setHex(0x000000);
    faces[hoveredIdx].mesh.material.emissiveIntensity=0;
  }
  hoveredIdx=idx;
  if(idx>=0){
    faces[idx].mesh.material.emissive.setHex(0xffffff);
    faces[idx].mesh.material.emissiveIntensity=0.12;
  }
}

// Continuous hover tracking
canvas.addEventListener('mousemove',e=>{
  if(mouseState.down) return; // don't hover-highlight while dragging
  const idx=getHitFromXY(e.clientX,e.clientY);
  setHover(idx===null?-1:idx);
});
canvas.addEventListener('mouseleave',()=>setHover(-1));

function paintFace(idx,hex){
  if(idx===null||idx<0) return;
  hex=hex.toLowerCase();
  if(faces[idx].color===hex) return; // no-op
  applyColor(idx, hex);
  recordColor(hex);
}

// Paint-all button
document.getElementById('btn-paint-all').onclick=()=>{
  const changes=faces
    .map((f,i)=>({faceIdx:i,prevColor:f.color,nextColor:activeColor}))
    .filter(c=>c.prevColor!==c.nextColor);
  if(!changes.length) return;
  changes.forEach(({faceIdx,nextColor})=>applyColor(faceIdx,nextColor,false));
  undoStack.push({bulk:true,changes});
  redoStack.length=0;
  recordColor(activeColor);
};

// ── Toolbar ───────────────────────────────────────────────────
let edgesOn=true;
document.getElementById('btn-home').onclick=resetCamera;
document.getElementById('btn-ortho').onclick=function(){orthoOn=!orthoOn;activeCamera=orthoOn?orthoCamera:camera;this.classList.toggle('on',orthoOn);this.textContent=orthoOn?'Perspective':'Ortho';tbUpdate();};
document.getElementById('btn-wire').onclick=function(){wireOn=!wireOn;this.classList.toggle('on',wireOn);faces.forEach(f=>f.mesh.material.wireframe=wireOn);};
document.getElementById('btn-edges').onclick=function(){edgesOn=!edgesOn;this.classList.toggle('on',edgesOn);faces.forEach(f=>{const el=f.mesh.children[0];if(el)el.visible=edgesOn;});};

// ── Resize / render ───────────────────────────────────────────
function resize(){const w=canvas.parentElement.clientWidth,h=canvas.parentElement.clientHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();tbUpdate();}
window.addEventListener('resize',resize);resize();

// ── OCCT ─────────────────────────────────────────────────────
const overlay=document.getElementById('overlay');
const overlayText=document.getElementById('overlay-text');
let occt=null;

function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('Failed: '+src));document.head.appendChild(s);});}

async function initOcct(){
  try{
    log('Loading OpenCascade...');
    await loadScript('https://cdn.jsdelivr.net/npm/occt-import-js@0.0.22/dist/occt-import-js.min.js');
    overlayText.textContent='Initializing WASM...';
    occt=await occtimportjs({locateFile:f=>`https://cdn.jsdelivr.net/npm/occt-import-js@0.0.22/dist/${f}`});
    log('OpenCascade ready','log-ok');
    overlay.style.display='none';
  }catch(err){
    log('OpenCascade failed: '+err.message,'log-err');
    overlay.style.display='none';
  }
}

// ── File input ────────────────────────────────────────────────
const dropZone=document.getElementById('drop-zone'),fileInput=document.getElementById('file-input');
dropZone.onclick=()=>fileInput.click();
fileInput.onchange=e=>{if(e.target.files[0])readFile(e.target.files[0]);};
dropZone.ondragover=e=>{e.preventDefault();dropZone.classList.add('drag-over');};
dropZone.ondragleave=()=>dropZone.classList.remove('drag-over');
dropZone.ondrop=e=>{e.preventDefault();dropZone.classList.remove('drag-over');if(e.dataTransfer.files[0])readFile(e.dataTransfer.files[0]);};

let rawText='';

function readFile(file){
  const reader=new FileReader();
  reader.onload=ev=>{
    const buf=new Uint8Array(ev.target.result);
    rawText=new TextDecoder().decode(buf);
    loadStepFile(buf,file.name);
  };
  reader.readAsArrayBuffer(file);
}

async function loadStepFile(buffer,filename){
  if(!occt){log('OCCT not ready','log-err');return;}
  overlay.style.display='flex';
  overlayText.textContent='Tessellating...';
  log(`Loading ${filename} (${(buffer.byteLength/1024).toFixed(0)} KB)...`);
  await new Promise(r=>setTimeout(r,20));
  try{
    const result=occt.ReadStepFile(buffer,null);
    if(!result||!result.success){log('OCCT failed to parse','log-err');overlay.style.display='none';return;}
    
    for(const m of result.meshes){
      const bf=m.brep_faces;
      log(`Mesh "${m.name||'?'}": ${m.index?m.index.array.length/3:0} tris, ${bf?bf.length:0} faces`);
    }
    buildScene(result);
  }catch(err){
    log('Error: '+err.message,'log-err');
    console.error(err);
  }
  overlay.style.display='none';
}

// ── Build scene ───────────────────────────────────────────────
function buildScene(result){
  if(modelGroup){scene.remove(modelGroup);modelGroup=null;}
  faces=[];selectedIdx=-1;
  document.getElementById('btn-hide').disabled=true;
  modelGroup=new THREE.Group();

  // Compute global bounds
  let x0=Infinity,y0=Infinity,z0=Infinity,x1=-Infinity,y1=-Infinity,z1=-Infinity;
  for(const m of result.meshes){
    const p=m.attributes.position.array;
    for(let i=0;i<p.length;i+=3){
      if(p[i]<x0)x0=p[i];if(p[i]>x1)x1=p[i];
      if(p[i+1]<y0)y0=p[i+1];if(p[i+1]>y1)y1=p[i+1];
      if(p[i+2]<z0)z0=p[i+2];if(p[i+2]>z1)z1=p[i+2];
    }
  }
  const cx=(x0+x1)/2,cy=(y0+y1)/2,cz=(z0+z1)/2;
  const sc=6/Math.max(x1-x0,y1-y0,z1-z0,0.001);

  let faceIdx=0,meshIndex=0;
  for(const meshData of result.meshes){
    const pos=meshData.attributes.position.array;
    const nor=meshData.attributes.normal?meshData.attributes.normal.array:null;
    const idxArr=meshData.index?meshData.index.array:null;

    // Scale positions
    const sp=new Float32Array(pos.length);
    for(let i=0;i<pos.length;i+=3){sp[i]=(pos[i]-cx)*sc;sp[i+1]=(pos[i+1]-cy)*sc;sp[i+2]=(pos[i+2]-cz)*sc;}

    const brepFaces=meshData.brep_faces;
    if(brepFaces&&brepFaces.length>=1&&idxArr){
      // Split per brep_face
      for(let bfi=0;bfi<brepFaces.length;bfi++){
        const bf=brepFaces[bfi];
        const triStart=bf.first*3;
        const triEnd=(bf.last+1)*3;
        const fIdxSlice=idxArr.slice(triStart,triEnd);
        if(!fIdxSlice.length)continue;

        // Remap to compact vertex buffer
        const used=new Set(fIdxSlice);
        const verts=[...used].sort((a,b)=>a-b);
        const remap=new Map(verts.map((v,i)=>[v,i]));
        const fp=new Float32Array(verts.length*3);
        const fn=nor?new Float32Array(verts.length*3):null;
        for(let i=0;i<verts.length;i++){
          const v=verts[i];
          fp[i*3]=sp[v*3];fp[i*3+1]=sp[v*3+1];fp[i*3+2]=sp[v*3+2];
          if(fn){fn[i*3]=nor[v*3];fn[i*3+1]=nor[v*3+1];fn[i*3+2]=nor[v*3+2];}
        }
        const fi=new Uint32Array(fIdxSlice.length);
        for(let i=0;i<fIdxSlice.length;i++)fi[i]=remap.get(fIdxSlice[i]);

        const geo=new THREE.BufferGeometry();
        geo.setAttribute('position',new THREE.BufferAttribute(fp,3));
        if(fn)geo.setAttribute('normal',new THREE.BufferAttribute(fn,3));
        else geo.computeVertexNormals();
        geo.setIndex(new THREE.BufferAttribute(fi,1));

        const planar=isPlanarTessellation(fp,fi);
        const area=tessellationArea(fp,fi)/(sc*sc);
        const c=bf.color;
        const col=c?rgbToHex(c[0],c[1],c[2]):'#aaaaaa';
        const mat=new THREE.MeshPhongMaterial({color:col,side:THREE.DoubleSide,shininess:5,specular:0x0a0a0a,polygonOffset:true,polygonOffsetFactor:1,polygonOffsetUnits:1});
        const mesh=new THREE.Mesh(geo,mat);
        const edgeGeo=new THREE.EdgesGeometry(geo,30);
        const edgeLine=new THREE.LineSegments(edgeGeo,new THREE.LineBasicMaterial({color:0x000000,opacity:0.7,transparent:true}));
        mesh.add(edgeLine);
        modelGroup.add(mesh);
        faces.push({id:faceIdx,meshName:meshData.name||'',meshIndex,planarTess:planar,tessArea:area,brepFaceIndex:bfi,globalFaceIdx:faceIdx,name:`Face ${faceIdx+1}`,mesh:modelGroup.children[modelGroup.children.length-1],color:col,defaultColor:col});
        faceIdx++;
      }
    } else {
      // Whole mesh as single face
      const geo=new THREE.BufferGeometry();
      geo.setAttribute('position',new THREE.BufferAttribute(sp,3));
      if(nor)geo.setAttribute('normal',new THREE.BufferAttribute(new Float32Array(nor),3));
      if(idxArr)geo.setIndex(new THREE.BufferAttribute(new Uint32Array(idxArr),1));
      if(!nor)geo.computeVertexNormals();
      const mat=new THREE.MeshPhongMaterial({color:'#aaaaaa',side:THREE.DoubleSide,shininess:5,specular:0x0a0a0a,polygonOffset:true,polygonOffsetFactor:1,polygonOffsetUnits:1});
      const mesh=new THREE.Mesh(geo,mat);
      const edgeGeo2=new THREE.EdgesGeometry(geo,30);
      const edgeLine2=new THREE.LineSegments(edgeGeo2,new THREE.LineBasicMaterial({color:0x000000,opacity:0.7,transparent:true}));
      mesh.add(edgeLine2);
      modelGroup.add(mesh);
      const col2=meshData.color?rgbToHex(meshData.color[0],meshData.color[1],meshData.color[2]):'#aaaaaa';
      faces.push({id:faceIdx,meshName:meshData.name||'',meshIndex,planarTess:null,brepFaceIndex:0,globalFaceIdx:faceIdx,name:meshData.name||`Face ${faceIdx+1}`,mesh:modelGroup.children[modelGroup.children.length-1],color:col2,defaultColor:col2});
      faceIdx++;
    }
    meshIndex++;
  }

  scene.add(modelGroup);
  resetCamera();
  document.getElementById('btn-export').disabled=false;
  document.getElementById('btn-paint-all').disabled=false;
  undoStack.length=0; redoStack.length=0;

  // OCCT does not report OVER_RIDING_STYLED_ITEM colors back as bf.color, so the
  // file's own colors are read from the STEP text once faces are mapped to entities.
  assignStepFaceIds();
  applyStepColors();
  log(`Loaded ${faces.length} faces`,'log-ok');

  initPalette();
}

function rgbToHex(r,g,b){return '#'+[r,g,b].map(v=>Math.round(v*255).toString(16).padStart(2,'0')).join('');}

// Surface area of a tessellated face. Rigid placement does not change it, so it can
// be compared against the same face measured from the STEP text.
function tessellationArea(pos,idx){
  let area=0;
  for(let i=0;i+2<idx.length;i+=3){
    const a=idx[i]*3,b=idx[i+1]*3,c=idx[i+2]*3;
    const ux=pos[b]-pos[a],uy=pos[b+1]-pos[a+1],uz=pos[b+2]-pos[a+2];
    const vx=pos[c]-pos[a],vy=pos[c+1]-pos[a+1],vz=pos[c+2]-pos[a+2];
    area+=0.5*Math.hypot(uy*vz-uz*vy,uz*vx-ux*vz,ux*vy-uy*vx);
  }
  return area;
}

// True when every triangle of a tessellated face shares one normal, i.e. the face
// is flat. Unlike coordinates this survives whatever placement the assembly applies,
// which is what makes it usable for checking a mapping against the STEP text.
function isPlanarTessellation(pos,idx){
  let nx=0,ny=0,nz=0,have=false;
  for(let i=0;i+2<idx.length;i+=3){
    const a=idx[i]*3,b=idx[i+1]*3,c=idx[i+2]*3;
    const ux=pos[b]-pos[a],uy=pos[b+1]-pos[a+1],uz=pos[b+2]-pos[a+2];
    const vx=pos[c]-pos[a],vy=pos[c+1]-pos[a+1],vz=pos[c+2]-pos[a+2];
    let cx=uy*vz-uz*vy,cy=uz*vx-ux*vz,cz=ux*vy-uy*vx;
    const len=Math.hypot(cx,cy,cz);
    if(len<1e-12) continue;            // degenerate sliver, tells us nothing
    cx/=len;cy/=len;cz/=len;
    if(!have){nx=cx;ny=cy;nz=cz;have=true;continue;}
    // 0.999 ≈ 2.5°, loose enough for tessellation noise on a flat face
    if(Math.abs(nx*cx+ny*cy+nz*cz)<0.999) return false;
  }
  return have?true:null;
}

// ── STEP topology ─────────────────────────────────────────────
// occt-import-js emits one mesh per solid, walking the product/assembly tree in
// order, and inside each mesh one brep face per topological face in CLOSED_SHELL
// list order. Reproducing that same traversal over the raw text is what lets a
// picked face be written back to the right ADVANCED_FACE. Guessing the entity id
// from a face index does not survive exporters (SolidWorks, Altium) that number
// entities out of topological order, nor multi-body files where the index restarts.
const STEP_BODY_TYPES=new Set(['MANIFOLD_SOLID_BREP','SHELL_BASED_SURFACE_MODEL','BREP_WITH_VOIDS','FACETED_BREP']);
const STEP_SHELL_TYPES=new Set(['CLOSED_SHELL','OPEN_SHELL']);
const STEP_FACE_TYPES=new Set(['ADVANCED_FACE','FACE_SURFACE']);
const STEP_REP_TYPES=new Set(['ADVANCED_BREP_SHAPE_REPRESENTATION','MANIFOLD_SURFACE_SHAPE_REPRESENTATION','FACETED_BREP_SHAPE_REPRESENTATION','GEOMETRICALLY_BOUNDED_SURFACE_SHAPE_REPRESENTATION','SHAPE_REPRESENTATION']);

let stepTopo=null;       // {ents,bodies,faces,repCtx}
let stepMappingOk=false; // false ⇒ we cannot say which entity a face is; export is refused

function stepRefs(s){return [...(s||'').matchAll(/#(\d+)/g)].map(m=>parseInt(m[1]));}

function splitParams(s){
  const out=[];let depth=0,cur='',quoted=false;
  for(const c of s){
    if(c==="'")quoted=!quoted;
    if(!quoted&&c==='('){depth++;cur+=c;}
    else if(!quoted&&c===')'){depth--;cur+=c;}
    else if(!quoted&&c===','&&depth===0){out.push(cur.trim());cur='';}
    else cur+=c;
  }
  if(cur.trim())out.push(cur.trim());
  return out;
}

function parseStepEntities(text){
  const flat=text.replace(/\r/g,' ').replace(/\n/g,' ');
  const ents=new Map();
  const re=/#(\d+)\s*=\s*([A-Z_][A-Z_0-9]*)\s*\(([^;]*?)\)\s*;/g;
  let m;
  while((m=re.exec(flat))!==null) ents.set(parseInt(m[1]),{type:m[2],params:m[3]});
  // Complex instances — "#12=(REPRESENTATION_RELATIONSHIP(..)SHAPE_REPRESENTATION_RELATIONSHIP())" —
  // are not matched above, and in most assemblies that is exactly how a part is
  // linked to the representation holding its solids. Record every name they carry.
  const complexRe=/#(\d+)\s*=\s*\(\s*([A-Z_][A-Z_0-9]*\s*\([^;]*?)\)\s*;/g;
  while((m=complexRe.exec(flat))!==null){
    const id=parseInt(m[1]);
    if(ents.has(id)) continue;
    const types=new Set([...m[2].matchAll(/([A-Z_][A-Z_0-9]*)\s*\(/g)].map(x=>x[1]));
    ents.set(id,{type:[...types][0]||'',types,params:m[2]});
  }
  return ents;
}

// A complex instance answers to every name it carries, not just the first.
function entIs(e,type){return !!e&&(e.type===type||(e.types!==undefined&&e.types.has(type)));}
function entIsAny(e,types){
  if(!e) return false;
  if(types.has(e.type)) return true;
  if(e.types) for(const t of e.types) if(types.has(t)) return true;
  return false;
}

// Complex instances like "#377 = ( GEOMETRIC_REPRESENTATION_CONTEXT(3) ... )" are
// not matched by the simple entity regex, so collect them by keyword separately.
function stepComplexIds(text,keyword){
  const ids=new Set(),re=new RegExp('#(\\d+)\\s*=\\s*\\(\\s*[^;]*'+keyword,'g');
  let m;
  while((m=re.exec(text))!==null) ids.add(parseInt(m[1]));
  return ids;
}

// Bodies of one representation, in item order; each body's faces in shell order.
function stepRepBodies(ents,repId){
  const out=[],rep=ents.get(repId);
  if(!rep) return out;
  for(const r of stepRefs(rep.params)){
    const body=ents.get(r);
    if(!entIsAny(body,STEP_BODY_TYPES)) continue;
    const faceIds=[];
    for(let s of stepRefs(body.params)){
      let shell=ents.get(s);
      // BREP_WITH_VOIDS reaches its void shells through ORIENTED_CLOSED_SHELL.
      if(entIs(shell,'ORIENTED_CLOSED_SHELL')){
        s=stepRefs(shell.params)[0];
        shell=ents.get(s);
      }
      if(!entIsAny(shell,STEP_SHELL_TYPES)) continue;
      for(const f of stepRefs(shell.params)){
        if(entIsAny(ents.get(f),STEP_FACE_TYPES)) faceIds.push(f);
      }
    }
    if(faceIds.length) out.push({bodyId:r,repId,faceIds});
  }
  return out;
}

// PRODUCT_DEFINITION → the representations that actually carry solids. The link is
// PD ← PRODUCT_DEFINITION_SHAPE ← SHAPE_DEFINITION_REPRESENTATION → SHAPE_REPRESENTATION,
// and a SHAPE_REPRESENTATION_RELATIONSHIP often stands between that and the ABSR.
function stepProductReps(ents){
  const pdOfPds=new Map();
  for(const [id,e] of ents)
    if(e.type==='PRODUCT_DEFINITION_SHAPE') pdOfPds.set(id,stepRefs(e.params)[0]);

  const repsOfPd=new Map();
  for(const [,e] of ents){
    if(e.type!=='SHAPE_DEFINITION_REPRESENTATION') continue;
    const [pds,sr]=stepRefs(e.params);
    const pd=pdOfPds.get(pds);
    if(pd==null) continue;
    if(!repsOfPd.has(pd)) repsOfPd.set(pd,[]);
    repsOfPd.get(pd).push(sr);
  }

  // The relationship placing a component inside its parent is reached through a
  // CONTEXT_DEPENDENT_SHAPE_REPRESENTATION. Following those would pull a child's
  // solids up into the parent product, so they are excluded here.
  const assemblyRels=new Set();
  for(const [,e] of ents){
    if(!entIs(e,'CONTEXT_DEPENDENT_SHAPE_REPRESENTATION')) continue;
    for(const r of stepRefs(e.params)) assemblyRels.add(r);
  }
  const linked=new Map();
  for(const [id,e] of ents){
    if(assemblyRels.has(id)) continue;
    if(!entIs(e,'SHAPE_REPRESENTATION_RELATIONSHIP')&&!entIs(e,'REPRESENTATION_RELATIONSHIP')) continue;
    const rs=stepRefs(e.params);
    if(rs.length<2) continue;
    for(const pair of [[rs[0],rs[1]],[rs[1],rs[0]]]){
      if(!linked.has(pair[0])) linked.set(pair[0],[]);
      linked.get(pair[0]).push(pair[1]);
    }
  }

  const out=new Map();
  for(const [pd,srs] of repsOfPd){
    const reps=[],seen=new Set();
    const walk=r=>{
      if(seen.has(r)) return;
      seen.add(r);
      const e=ents.get(r);
      if(!entIsAny(e,STEP_REP_TYPES)) return;
      if(stepRepBodies(ents,r).length) reps.push(r);
      for(const n of (linked.get(r)||[])) walk(n);
    };
    for(const sr of srs) walk(sr);
    out.set(pd,reps);
  }
  return out;
}

// Walk the assembly the way occt-import-js does: a component is meshed before the
// solids its parent owns, and a product used more than once is meshed once per
// occurrence, so the same ADVANCED_FACE can back several tessellated faces.
function stepAssemblyBodies(ents,repsOfPd){
  const children=new Map(),isChild=new Set(),products=new Set();
  for(const [,e] of ents){
    if(!entIs(e,'NEXT_ASSEMBLY_USAGE_OCCURRENCE')) continue;
    const rs=stepRefs(e.params);
    if(rs.length<2) continue;
    const parent=rs[0],child=rs[1];
    if(!children.has(parent)) children.set(parent,[]);
    children.get(parent).push(child);
    isChild.add(child);products.add(parent);products.add(child);
  }
  for(const [id,e] of ents) if(entIs(e,'PRODUCT_DEFINITION')) products.add(id);

  const bodies=[],usedRep=new Set();
  const walk=(pd,depth)=>{
    if(depth>64) return;
    for(const c of (children.get(pd)||[])) walk(c,depth+1);
    for(const rep of (repsOfPd.get(pd)||[])){
      usedRep.add(rep);
      bodies.push(...stepRepBodies(ents,rep));
    }
  };
  for(const pd of products) if(!isChild.has(pd)) walk(pd,0);
  return {bodies,usedRep};
}

// Flat list of faces in occt-import-js emission order.
function buildStepTopology(text){
  const ents=parseStepEntities(text);
  const ctxIds=stepComplexIds(text,'GEOMETRIC_REPRESENTATION_CONTEXT');
  const repsOfPd=stepProductReps(ents);
  const walked=stepAssemblyBodies(ents,repsOfPd);
  const bodies=walked.bodies,usedRep=walked.usedRep;

  // Representations not reachable through the product structure still get meshed.
  for(const [id,e] of ents){
    if(!entIsAny(e,STEP_REP_TYPES)||usedRep.has(id)) continue;
    const b=stepRepBodies(ents,id);
    if(!b.length) continue;
    usedRep.add(id);bodies.push(...b);
  }

  const repCtx=new Map();
  for(const rep of usedRep){
    const e=ents.get(rep);
    if(!e) continue;
    const rs=stepRefs(e.params);
    const ctx=rs.filter(r=>ctxIds.has(r))[0];
    repCtx.set(rep,ctx!==undefined?ctx:rs[rs.length-1]);
  }

  const flat=[];
  bodies.forEach((b,meshIndex)=>b.faceIds.forEach(stepFaceId=>
    flat.push({stepFaceId,bodyId:b.bodyId,repId:b.repId,meshIndex})));
  return {ents,bodies,faces:flat,repCtx};
}

// Surfaces that can never tessellate flat. If the text says a face is one of these
// but the triangles are coplanar (or the text says PLANE and they are not), the face
// we are looking at is not the face we think it is.
const STEP_CURVED_SURFACES=new Set(['CYLINDRICAL_SURFACE','CONICAL_SURFACE','SPHERICAL_SURFACE','TOROIDAL_SURFACE','SURFACE_OF_REVOLUTION','SURFACE_OF_LINEAR_EXTRUSION']);

function stepPoints(ents){
  const pts=new Map();
  for(const [id,e] of ents){
    if(!entIs(e,'CARTESIAN_POINT')) continue;
    const n=e.params.match(/[-+]?\d*\.?\d+(?:E[-+]?\d+)?/gi);
    if(n&&n.length>=3) pts.set(id,[parseFloat(n[n.length-3]),parseFloat(n[n.length-2]),parseFloat(n[n.length-1])]);
  }
  return pts;
}

// Area of a planar face read straight off its boundary loops. Only attempted when
// every edge is a straight line, which is where the loop vertices are the polygon.
function stepPlanarFaceArea(ents,pts,faceId){
  const face=ents.get(faceId);
  if(!face) return null;
  const areas=[];
  for(const b of stepRefs(face.params)){
    const bound=ents.get(b);
    if(!bound||!/^FACE_(OUTER_)?BOUND$/.test(bound.type)) continue;
    const loop=ents.get(stepRefs(bound.params)[0]);
    if(!entIs(loop,'EDGE_LOOP')) return null;
    const poly=[];
    for(const oeId of stepRefs(loop.params)){
      const oe=ents.get(oeId);
      if(!entIs(oe,'ORIENTED_EDGE')) return null;
      const edge=ents.get(stepRefs(oe.params)[0]);
      if(!entIs(edge,'EDGE_CURVE')) return null;
      const er=stepRefs(edge.params);
      if(!entIs(ents.get(er[2]),'LINE')) return null;   // arcs need real integration
      const forward=!/\.F\./.test(splitParams(oe.params).pop()||'');
      const vertex=ents.get(forward?er[0]:er[1]);
      if(!entIs(vertex,'VERTEX_POINT')) return null;
      const pt=pts.get(stepRefs(vertex.params)[0]);
      if(!pt) return null;
      poly.push(pt);
    }
    if(poly.length<3) return null;
    // Newell: twice the area vector of a planar polygon, valid in any orientation.
    let ax=0,ay=0,az=0;
    for(let i=0;i<poly.length;i++){
      const q=poly[i],r=poly[(i+1)%poly.length];
      ax+=q[1]*r[2]-q[2]*r[1];
      ay+=q[2]*r[0]-q[0]*r[2];
      az+=q[0]*r[1]-q[1]*r[0];
    }
    areas.push(0.5*Math.hypot(ax,ay,az));
  }
  if(!areas.length) return null;
  // The largest loop is the outline whatever order the bounds were written in;
  // the rest are holes through it.
  const outer=Math.max(...areas);
  return Math.max(outer*2-areas.reduce((a,b)=>a+b,0),0);
}

function stepFaceSurfaceType(ents,faceId){
  const face=ents.get(faceId);
  if(!face) return null;
  // ADVANCED_FACE('name',(bounds),#surface,.T.) — the surface is the last reference.
  const rs=stepRefs(face.params);
  const surf=ents.get(rs[rs.length-1]);
  return surf?surf.type:null;
}

// Cross-check the mapping without trusting coordinates: an assembly places its
// components with arbitrary rotations, but whether a face is flat does not change.
function verifyStepMapping(){
  const ents=stepTopo.ents,pts=stepPoints(ents);
  let checked=0,wrong=0;
  for(const f of faces){
    if(f.planarTess===null||f.planarTess===undefined) continue;
    const surf=stepFaceSurfaceType(ents,f.stepFaceId);
    if(!surf) continue;
    if(surf==='PLANE'){
      checked++;
      if(!f.planarTess){wrong++;continue;}
      // Both flat: areas separate faces that a flatness test alone cannot.
      const area=stepPlanarFaceArea(ents,pts,f.stepFaceId);
      if(area!==null&&area>0&&f.tessArea>0&&
         Math.abs(area-f.tessArea)/Math.max(area,f.tessArea)>0.02) wrong++;
    } else if(STEP_CURVED_SURFACES.has(surf)){
      checked++;
      if(f.planarTess) wrong++;
    }
  }
  // A handful of degenerate or near-flat faces is normal; a wrong order is not.
  const ok=checked===0||wrong<=Math.max(1,checked*0.02);
  if(!ok) log(`Face mapping rejected: ${wrong} of ${checked} faces do not match the STEP geometry`,'log-err');
  return ok;
}

// Attach the STEP entity id to every three.js face, but only once the tessellation
// we got back agrees with the topology we parsed. A silent mismatch is how wrong
// faces used to get painted, so a mismatch disables export instead.
function assignStepFaceIds(){
  stepTopo=null;stepMappingOk=false;
  if(!rawText||!faces.length) return;
  stepTopo=buildStepTopology(rawText);

  const meshCounts=[];
  for(const f of faces) meshCounts[f.meshIndex]=(meshCounts[f.meshIndex]||0)+1;
  const topoCounts=stepTopo.bodies.map(b=>b.faceIds.length);

  if(meshCounts.length!==topoCounts.length||meshCounts.some((n,i)=>n!==topoCounts[i])){
    log(`Face mapping failed: tessellation has ${meshCounts.join(',')} faces per body, STEP topology has ${topoCounts.join(',')}`,'log-err');
    console.warn('[STEP topology] mismatch',{meshCounts,topoCounts});
    return;
  }
  faces.forEach((f,i)=>{
    const t=stepTopo.faces[i];
    f.stepFaceId=t.stepFaceId;f.stepBodyId=t.bodyId;f.stepRepId=t.repId;
  });
  if(!verifyStepMapping()){
    faces.forEach(f=>{f.stepFaceId=undefined;f.stepBodyId=undefined;f.stepRepId=undefined;});
    return;
  }
  stepMappingOk=true;

  const distinct=new Set(stepTopo.faces.map(t=>t.stepFaceId)).size;
  if(distinct<stepTopo.faces.length)
    log(`${faces.length-distinct} faces are repeated instances of the same part — painting one paints them all`,'log-warn');
  log(`Mapped ${faces.length} faces to STEP entities`,'log-ok');
}

// Walk PRESENTATION_STYLE_ASSIGNMENT → … → COLOUR_RGB, following the first
// reference at each step, and return [r,g,b].
function stepPsaToRgb(ents,psaId){
  let id=psaId;
  for(let hop=0;hop<8;hop++){
    const e=ents.get(id);
    if(!e) return null;
    if(e.type==='COLOUR_RGB'){
      const n=e.params.match(/[-+]?[\d.]+(?:E[-+]?\d+)?/gi);
      if(!n||n.length<3) return null;
      return [parseFloat(n[n.length-3]),parseFloat(n[n.length-2]),parseFloat(n[n.length-1])];
    }
    const p=splitParams(e.params);
    // The colour is reached through the last parameter that carries a reference,
    // which skips the leading name string these entities usually start with.
    let nextId=null;
    for(let i=p.length-1;i>=0;i--){
      const r=stepRefs(p[i]);
      if(r.length){nextId=r[0];break;}
    }
    if(nextId==null||nextId===id) return null;
    id=nextId;
  }
  return null;
}

// Colours already in the file, keyed by what they are attached to.
function stepReadStyles(ents){
  const face=new Map(),body=new Map(),rep=new Map();
  for(const [,e] of ents){
    if(e.type!=='STYLED_ITEM'&&e.type!=='OVER_RIDING_STYLED_ITEM') continue;
    const p=splitParams(e.params);
    const psaId=stepRefs(p[1])[0],itemId=stepRefs(p[2])[0];
    if(psaId==null||itemId==null) continue;
    const item=ents.get(itemId);
    if(!item) continue;
    const rgb=stepPsaToRgb(ents,psaId);
    if(!rgb) continue;
    if(STEP_FACE_TYPES.has(item.type)) face.set(itemId,rgb);
    else if(STEP_BODY_TYPES.has(item.type)) body.set(itemId,rgb);
    else if(STEP_REP_TYPES.has(item.type)) rep.set(itemId,rgb);
  }
  return {face,body,rep};
}

// Apply the file's own colours: face style wins, then body, then representation.
function applyStepColors(){
  if(!stepMappingOk||!stepTopo) return;
  const styles=stepReadStyles(stepTopo.ents);
  let applied=0;
  for(const f of faces){
    const rgb=styles.face.get(f.stepFaceId)||styles.body.get(f.stepBodyId)||styles.rep.get(f.stepRepId);
    if(!rgb) continue;
    const hex=rgbToHex(rgb[0],rgb[1],rgb[2]);
    f.mesh.material.color.set(hex);
    f.color=hex;f.defaultColor=hex;
    applied++;
  }
  if(applied) log(`Applied ${applied} face colors from STEP`,'log-ok');
}

// ── Export ────────────────────────────────────────────────────

// Style chains left behind by a removed STYLED_ITEM are inert but would pile up
// on every round-trip, so sweep presentation entities nothing references any more.
const STEP_PRESENTATION_TYPES=new Set(['PRESENTATION_STYLE_ASSIGNMENT','SURFACE_STYLE_USAGE','SURFACE_SIDE_STYLE','SURFACE_STYLE_FILL_AREA','SURFACE_STYLE_BOUNDARY','FILL_AREA_STYLE','FILL_AREA_STYLE_COLOUR','CURVE_STYLE','COLOUR_RGB','COLOUR_SPECIFICATION','DRAUGHTING_PRE_DEFINED_COLOUR']);

function sweepOrphanStyles(text){
  const defRe=/#(\d+)\s*=\s*([A-Z_][A-Z_0-9]*)\s*\([^;]*?\)\s*;/g;
  for(let pass=0;pass<8;pass++){
    const referenced=new Set();
    for(const m of text.matchAll(/#(\d+)(?!\s*=)/g)) referenced.add(parseInt(m[1]));
    const dead=new Set();
    let m;
    defRe.lastIndex=0;
    while((m=defRe.exec(text))!==null){
      const id=parseInt(m[1]);
      if(STEP_PRESENTATION_TYPES.has(m[2])&&!referenced.has(id)) dead.add(id);
    }
    if(!dead.size) break;
    text=text.replace(defRe,(whole,id)=>dead.has(parseInt(id))?'':whole);
  }
  return text;
}

// Drop the styling attached to faces and to the bodies we are about to restyle,
// so re-exporting a file does not stack contradictory overrides on one entity.
function stripStyling(text,ents,bodyIds){
  const kill=new Set();
  for(const [id,e] of ents){
    if(e.type!=='STYLED_ITEM'&&e.type!=='OVER_RIDING_STYLED_ITEM') continue;
    const itemId=stepRefs(splitParams(e.params)[2]||'')[0];
    const item=itemId!=null?ents.get(itemId):null;
    if(!item) continue;
    if(STEP_FACE_TYPES.has(item.type)||bodyIds.has(itemId)) kill.add(id);
  }
  if(!kill.size) return text;

  let out=text;
  for(const id of kill)
    out=out.replace(new RegExp('#'+id+'\\s*=\\s*(?:OVER_RIDING_)?STYLED_ITEM\\s*\\([^;]*;','g'),'');

  // Prune the killed ids out of every list that referenced them.
  out=out.replace(/#(\d+)\s*=\s*(MECHANICAL_DESIGN_GEOMETRIC_PRESENTATION_REPRESENTATION|PRESENTATION_LAYER_ASSIGNMENT|DRAUGHTING_MODEL)\s*\(([^;]*)\)\s*;/g,
    (whole,id,type,params)=>{
      const parts=splitParams(params);
      const listIdx=parts.findIndex(p=>p.startsWith('('));
      if(listIdx<0) return whole;
      const kept=splitParams(parts[listIdx].slice(1,-1)).filter(r=>!kill.has(stepRefs(r)[0]));
      if(!kept.length) return '';
      parts[listIdx]='('+kept.join(',')+')';
      return '#'+id+'='+type+'('+parts.join(',')+');';
    });
  return sweepOrphanStyles(out);
}

document.getElementById('btn-export').onclick=()=>{
  if(!rawText){log('No file loaded','log-warn');return;}
  if(!stepMappingOk){
    log('Export refused: faces could not be matched to STEP entities','log-err');
    return;
  }
  const colored=faces.filter(f=>f.stepFaceId&&(f.userColored||f.color!==f.defaultColor||f.defaultColor!=='#aaaaaa'));
  if(!colored.length){log('No colors applied','log-warn');return;}

  const ents=stepTopo.ents;
  let next=0;
  for(const m of rawText.matchAll(/#(\d+)\s*=/g)) if(parseInt(m[1])>next) next=parseInt(m[1]);
  next++;

  const allLines=[];
  const styleCache=new Map();
  function makeStyle(hex){
    if(styleCache.has(hex)) return styleCache.get(hex);
    // Raw sRGB values (hex/255) — matches what Onshape writes and Altium reads back.
    const rgb=[hex.slice(1,3),hex.slice(3,5),hex.slice(5,7)]
      .map(h=>(parseInt(h,16)/255).toFixed(15));
    const colId=next++,fascId=next++,fasId=next++,ssfaId=next++,sssId=next++,ssuId=next++,psaId=next++;
    allLines.push(
      '#'+colId+"=COLOUR_RGB('',"+rgb[0]+','+rgb[1]+','+rgb[2]+');',
      '#'+fascId+"=FILL_AREA_STYLE_COLOUR('',#"+colId+');',
      '#'+fasId+"=FILL_AREA_STYLE('',(#"+fascId+'));',
      '#'+ssfaId+'=SURFACE_STYLE_FILL_AREA(#'+fasId+');',
      '#'+sssId+"=SURFACE_SIDE_STYLE('',(#"+ssfaId+'));',
      '#'+ssuId+'=SURFACE_STYLE_USAGE(.BOTH.,#'+sssId+');',
      '#'+psaId+'=PRESENTATION_STYLE_ASSIGNMENT((#'+ssuId+'));'
    );
    styleCache.set(hex,psaId);
    return psaId;
  }

  // Group by the body each face actually belongs to. One base style shared across
  // every body is what used to put overrides on the wrong solid.
  const perBody=new Map();
  for(const f of colored){
    if(!perBody.has(f.stepBodyId)) perBody.set(f.stepBodyId,{repId:f.stepRepId,faces:[]});
    perBody.get(f.stepBodyId).faces.push(f);
  }
  const allOfBody=new Map();
  for(const f of faces){
    if(!allOfBody.has(f.stepBodyId)) allOfBody.set(f.stepBodyId,[]);
    allOfBody.get(f.stepBodyId).push(f);
  }

  // An instanced part is one entity behind several tessellated faces; keep one
  // colour per entity rather than emitting contradictory overrides.
  for(const grp of perBody.values()){
    const seen=new Map();
    let clashes=0;
    for(const f of grp.faces){
      const prev=seen.get(f.stepFaceId);
      if(prev===undefined) seen.set(f.stepFaceId,f);
      else if(prev.color!==f.color) clashes++;
    }
    if(clashes) log(`${clashes} instanced faces had conflicting colors; kept the first`,'log-warn');
    grp.faces=[...seen.values()];
  }

  const itemsByRep=new Map();
  for(const [bodyId,grp] of perBody){
    // Base colour = the body's most common colour, so overrides stay minimal.
    const tally=new Map();
    for(const f of (allOfBody.get(bodyId)||grp.faces)) tally.set(f.color,(tally.get(f.color)||0)+1);
    const baseHex=[...tally.entries()].sort((a,b)=>b[1]-a[1])[0][0];

    const baseSiId=next++;
    allLines.push('#'+baseSiId+"=STYLED_ITEM('',(#"+makeStyle(baseHex)+'),#'+bodyId+');');
    const items=['#'+baseSiId];
    for(const f of grp.faces){
      if(f.color===baseHex) continue;
      const orsiId=next++;
      allLines.push('#'+orsiId+"=OVER_RIDING_STYLED_ITEM('',(#"+makeStyle(f.color)+'),#'+f.stepFaceId+',#'+baseSiId+');');
      items.push('#'+orsiId);
    }
    if(!itemsByRep.has(grp.repId)) itemsByRep.set(grp.repId,[]);
    itemsByRep.get(grp.repId).push(...items);
  }

  // One presentation per representation, bound to that representation's own context.
  for(const [repId,items] of itemsByRep){
    const ctxId=stepTopo.repCtx.get(repId);
    if(!ctxId){log('No context for representation #'+repId+'; colors may not load','log-warn');continue;}
    allLines.push('#'+(next++)+"=MECHANICAL_DESIGN_GEOMETRIC_PRESENTATION_REPRESENTATION('',("+items.join(',')+'),#'+ctxId+');');
  }

  let out=stripStyling(rawText,ents,new Set(perBody.keys()));
  const le=out.lastIndexOf('ENDSEC');
  out=out.slice(0,le)+allLines.join('\n')+'\n'+out.slice(le);

  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([out],{type:'text/plain'}));
  a.download='colored_output.step';a.click();
  log('Exported '+colored.length+' colored faces across '+perBody.size+' bodies','log-ok');
};

// ── Favorites ─────────────────────────────────────────────────
let favorites=[];
try{ favorites=JSON.parse(document.getElementById('favorites-data').textContent)||[]; }catch(e){}

// Capture original source before any DOM mutation
const _originalSrc=(()=>{
  // Walk script tags to find our own source
  const scripts=document.querySelectorAll('script:not([src]):not([type])');
  // Reconstruct from the full page source via fetch of location.href won't work for file://
  // Instead stash a clean copy of the HTML right now via outerHTML before any canvas resize etc.
  // We do this synchronously at parse time so canvases haven't been touched yet.
  return '<!DOCTYPE html>\n'+document.documentElement.outerHTML;
})();

function buildSaveHtml(){
  // Replace only the favorites-data JSON content in the original source
  return _originalSrc.replace(
    /(<script\s+id="favorites-data"[^>]*>)([\s\S]*?)(<\/script>)/,
    (_, open, _old, close)=> open+JSON.stringify(favorites)+close
  );
}

function renderFavorites(){
  const el=document.getElementById('fav-colors');
  el.innerHTML='';
  favorites.forEach((hex,i)=>{
    const sw=document.createElement('div');
    sw.className='fav-swatch';
    sw.style.background=hex;
    sw.title=hex+' · right-click to remove';
    sw.addEventListener('click',()=>setActiveColor(hex));
    sw.addEventListener('contextmenu',e=>{
      e.preventDefault();
      favorites.splice(i,1);
      renderFavorites();
    });
    el.appendChild(sw);
  });
}

document.getElementById('btn-fav-add').onclick=()=>{
  const hex=activeColor.toLowerCase();
  if(!favorites.includes(hex)){ favorites.push(hex); renderFavorites(); }
};

document.getElementById('btn-fav-save').onclick=async()=>{
  const html=buildSaveHtml();
  if(window.showSaveFilePicker){
    try{
      const fh=await window.showSaveFilePicker({
        suggestedName:'step-color-editor.html',
        types:[{description:'HTML file',accept:{'text/html':['.html']}}]
      });
      const w=await fh.createWritable();
      await w.write(html);
      await w.close();
      const btn=document.getElementById('btn-fav-save');
      const orig=btn.textContent;
      btn.textContent='Saved ✓';
      setTimeout(()=>btn.textContent=orig,1500);
    }catch(e){ if(e.name!=='AbortError') console.error(e); }
  } else {
    // Fallback for browsers without File System Access API
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));
    a.download='step-color-editor.html';
    a.click();
    URL.revokeObjectURL(a.href);
  }
};

renderFavorites();

initOcct();
